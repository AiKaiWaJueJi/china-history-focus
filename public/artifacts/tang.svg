<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="400" height="700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="38%" stop-color="rgba(201,162,39,0.42)"/>
      <stop offset="72%" stop-color="rgba(201,162,39,0.16)"/>
      <stop offset="100%" stop-color="#040506"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="rgba(240,220,166,0.3)"/>
      <stop offset="60%" stop-color="rgba(201,162,39,0.1)"/>
      <stop offset="100%" stop-color="rgba(201,162,39,0)"/>
    </radialGradient>
    <linearGradient id="vessel" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="rgba(240,220,166,0.7)"/>
      <stop offset="45%" stop-color="rgba(201,162,39,0.5)"/>
      <stop offset="100%" stop-color="rgba(201,162,39,0.1)"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="44%" r="62%">
      <stop offset="52%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.86)"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(5,7,10,0)"/>
      <stop offset="100%" stop-color="rgba(5,7,10,0.96)"/>
    </linearGradient>
  </defs>

  <rect width="400" height="700" fill="url(#bg)"/>
  <ellipse cx="200" cy="385" rx="240" ry="280" fill="url(#glow)"/>
  <circle cx="397" cy="483" r="1.3" fill="rgba(240,220,166,0.07)"/><circle cx="262" cy="249" r="0.7" fill="rgba(240,220,166,0.12)"/><circle cx="93" cy="52" r="1.0" fill="rgba(240,220,166,0.1)"/><circle cx="291" cy="359" r="2.5" fill="rgba(240,220,166,0.04)"/><circle cx="306" cy="354" r="2.4" fill="rgba(240,220,166,0.05)"/><circle cx="241" cy="269" r="1.1" fill="rgba(240,220,166,0.04)"/><circle cx="81" cy="117" r="1.1" fill="rgba(240,220,166,0.09)"/><circle cx="368" cy="123" r="1.7" fill="rgba(240,220,166,0.11000000000000001)"/><circle cx="22" cy="9" r="2.3" fill="rgba(240,220,166,0.08)"/><circle cx="82" cy="444" r="2.2" fill="rgba(240,220,166,0.05)"/><circle cx="207" cy="419" r="0.9" fill="rgba(240,220,166,0.04)"/><circle cx="111" cy="10" r="2.0" fill="rgba(240,220,166,0.06)"/><circle cx="389" cy="196" r="2.2" fill="rgba(240,220,166,0.12)"/><circle cx="12" cy="116" r="1.8" fill="rgba(240,220,166,0.07)"/><circle cx="220" cy="196" r="1.0" fill="rgba(240,220,166,0.08)"/><circle cx="124" cy="52" r="2.2" fill="rgba(240,220,166,0.11000000000000001)"/><circle cx="231" cy="411" r="1.3" fill="rgba(240,220,166,0.05)"/><circle cx="311" cy="119" r="2.1" fill="rgba(240,220,166,0.12)"/><circle cx="102" cy="230" r="2.0" fill="rgba(240,220,166,0.04)"/><circle cx="230" cy="158" r="0.8" fill="rgba(240,220,166,0.04)"/><circle cx="92" cy="140" r="2.1" fill="rgba(240,220,166,0.1)"/><circle cx="383" cy="331" r="1.7" fill="rgba(240,220,166,0.04)"/><circle cx="383" cy="6" r="0.7" fill="rgba(240,220,166,0.12)"/><circle cx="102" cy="666" r="1.6" fill="rgba(240,220,166,0.07)"/><circle cx="102" cy="518" r="0.8" fill="rgba(240,220,166,0.05)"/><circle cx="374" cy="582" r="1.2" fill="rgba(240,220,166,0.09)"/><circle cx="70" cy="642" r="2.0" fill="rgba(240,220,166,0.11000000000000001)"/><circle cx="102" cy="377" r="1.9" fill="rgba(240,220,166,0.1)"/><circle cx="13" cy="585" r="1.9" fill="rgba(240,220,166,0.11000000000000001)"/><circle cx="13" cy="581" r="0.7" fill="rgba(240,220,166,0.05)"/><circle cx="348" cy="300" r="1.0" fill="rgba(240,220,166,0.07)"/><circle cx="380" cy="192" r="2.2" fill="rgba(240,220,166,0.08)"/><circle cx="375" cy="471" r="2.5" fill="rgba(240,220,166,0.12)"/><circle cx="386" cy="178" r="2.4" fill="rgba(240,220,166,0.09)"/><circle cx="29" cy="161" r="0.7" fill="rgba(240,220,166,0.07)"/><circle cx="104" cy="384" r="1.8" fill="rgba(240,220,166,0.06)"/><circle cx="40" cy="200" r="1.7" fill="rgba(240,220,166,0.06)"/><circle cx="43" cy="386" r="1.2" fill="rgba(240,220,166,0.05)"/><circle cx="218" cy="630" r="1.6" fill="rgba(240,220,166,0.08)"/><circle cx="234" cy="558" r="1.2" fill="rgba(240,220,166,0.05)"/><circle cx="322" cy="122" r="0.8" fill="rgba(240,220,166,0.07)"/><circle cx="225" cy="348" r="2.0" fill="rgba(240,220,166,0.05)"/>

  <g fill="none" stroke="rgba(240,220,166,0.12)" stroke-width="1">
    <circle cx="200" cy="455" r="112"/>
    <circle cx="200" cy="455" r="164"/>
  </g>

  <!-- 器物母题：缩放在 0.5 左右，保证窄幅裁切下仍能看全 -->
  <g transform="translate(200 455) rotate(2) scale(0.52)">
    
    <ellipse cx="0" cy="108" rx="70" ry="10" fill="rgba(0,0,0,0.6)" filter="url(#soft)"/>
    <!-- 躯干 -->
    <ellipse cx="-6" cy="6" rx="58" ry="38" fill="url(#vessel)" stroke="rgba(240,220,166,0.72)" stroke-width="1.4"/>
    <!-- 颈：短而粗，避免看起来像长颈动物 -->
    <path d="M30 -18 Q46 -30 48 -46" fill="none" stroke="#f0dca6" stroke-width="34" stroke-linecap="round" opacity="0.5"/>
    <!-- 头：加大并压低头部角度，形成马的口鼻轮廓 -->
    <path d="M38 -52 Q52 -66 66 -58 Q76 -50 66 -40 Q52 -34 40 -42 Z" fill="#f0dca6" opacity="0.85"/>
    <path d="M64 -44 Q74 -42 76 -34 Q70 -30 62 -34 Z" fill="#f0dca6" opacity="0.7"/>
    <circle cx="58" cy="-52" r="2.8" fill="rgba(0,0,0,0.65)"/>
    <!-- 耳：立在头顶后侧 -->
    <path d="M44 -62 L40 -76 M54 -62 L56 -76" stroke="#f0dca6" stroke-width="3.6" stroke-linecap="round" opacity="0.85"/>
    <!-- 鬃毛 -->
    <path d="M34 -44 L26 -16" stroke="#f0dca6" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
    <!-- 尾 -->
    <path d="M-60 0 Q-88 10 -86 46" fill="none" stroke="#f0dca6" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
    <!-- 四腿：短而粗，符合陶马造型 -->
    <path d="M-44 34 L-48 88 M-18 40 L-20 90 M18 40 L22 90 M44 34 L50 88"
          stroke="#f0dca6" stroke-width="12" stroke-linecap="round" opacity="0.62"/>
  </g>

  <rect width="400" height="700" fill="url(#vig)"/>
  <rect y="560" width="400" height="140" fill="url(#fade)"/>
</svg>