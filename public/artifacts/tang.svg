<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="400" height="700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="38%" stop-color="rgba(201,162,39,0.42)"/>
      <stop offset="72%" stop-color="rgba(201,162,39,0.16)"/>
      <stop offset="100%" stop-color="#040506"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="52%">
      <stop offset="0%" stop-color="rgba(240,220,166,0.34)"/>
      <stop offset="58%" stop-color="rgba(201,162,39,0.1)"/>
      <stop offset="100%" stop-color="rgba(201,162,39,0)"/>
    </radialGradient>
    <linearGradient id="vessel" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="rgba(240,220,166,0.72)"/>
      <stop offset="42%" stop-color="rgba(201,162,39,0.52)"/>
      <stop offset="100%" stop-color="rgba(201,162,39,0.1)"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="42%" r="66%">
      <stop offset="55%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.88)"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(5,7,10,0)"/>
      <stop offset="100%" stop-color="rgba(5,7,10,0.96)"/>
    </linearGradient>
  </defs>

  <rect width="400" height="700" fill="url(#bg)"/>
  <ellipse cx="206" cy="295" rx="250" ry="280" fill="url(#glow)"/>
  <circle cx="273" cy="108" r="1.2" fill="rgba(240,220,166,0.04)"/><circle cx="100" cy="471" r="2.1" fill="rgba(240,220,166,0.13)"/><circle cx="187" cy="254" r="2.6" fill="rgba(240,220,166,0.1)"/><circle cx="178" cy="78" r="2.7" fill="rgba(240,220,166,0.05)"/><circle cx="233" cy="203" r="2.1" fill="rgba(240,220,166,0.09)"/><circle cx="315" cy="387" r="1.4" fill="rgba(240,220,166,0.12)"/><circle cx="308" cy="154" r="2.6" fill="rgba(240,220,166,0.06)"/><circle cx="260" cy="624" r="2.0" fill="rgba(240,220,166,0.08)"/><circle cx="324" cy="640" r="1.6" fill="rgba(240,220,166,0.11000000000000001)"/><circle cx="51" cy="123" r="2.1" fill="rgba(240,220,166,0.09)"/><circle cx="142" cy="322" r="1.4" fill="rgba(240,220,166,0.08)"/><circle cx="233" cy="77" r="1.0" fill="rgba(240,220,166,0.04)"/><circle cx="154" cy="246" r="1.0" fill="rgba(240,220,166,0.04)"/><circle cx="250" cy="17" r="1.7" fill="rgba(240,220,166,0.13)"/><circle cx="177" cy="188" r="2.2" fill="rgba(240,220,166,0.04)"/><circle cx="252" cy="400" r="2.1" fill="rgba(240,220,166,0.11000000000000001)"/><circle cx="271" cy="375" r="0.7" fill="rgba(240,220,166,0.08)"/><circle cx="308" cy="46" r="2.1" fill="rgba(240,220,166,0.05)"/><circle cx="242" cy="454" r="1.6" fill="rgba(240,220,166,0.1)"/><circle cx="253" cy="369" r="2.3" fill="rgba(240,220,166,0.05)"/><circle cx="205" cy="500" r="1.0" fill="rgba(240,220,166,0.04)"/><circle cx="164" cy="352" r="1.0" fill="rgba(240,220,166,0.06)"/><circle cx="303" cy="31" r="1.1" fill="rgba(240,220,166,0.1)"/><circle cx="398" cy="334" r="2.1" fill="rgba(240,220,166,0.05)"/><circle cx="193" cy="408" r="0.6" fill="rgba(240,220,166,0.08)"/><circle cx="280" cy="636" r="1.2" fill="rgba(240,220,166,0.06)"/><circle cx="216" cy="60" r="2.3" fill="rgba(240,220,166,0.09)"/><circle cx="267" cy="695" r="1.4" fill="rgba(240,220,166,0.08)"/><circle cx="297" cy="125" r="2.5" fill="rgba(240,220,166,0.05)"/><circle cx="111" cy="634" r="1.4" fill="rgba(240,220,166,0.08)"/><circle cx="90" cy="30" r="1