<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="400" height="700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="38%" stop-color="rgba(63,90,140,0.42)"/>
      <stop offset="72%" stop-color="rgba(63,90,140,0.16)"/>
      <stop offset="100%" stop-color="#040506"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="52%">
      <stop offset="0%" stop-color="rgba(168,188,224,0.34)"/>
      <stop offset="58%" stop-color="rgba(63,90,140,0.1)"/>
      <stop offset="100%" stop-color="rgba(63,90,140,0)"/>
    </radialGradient>
    <linearGradient id="vessel" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="rgba(168,188,224,0.72)"/>
      <stop offset="42%" stop-color="rgba(63,90,140,0.52)"/>
      <stop offset="100%" stop-color="rgba(63,90,140,0.1)"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="42%" r="66%">
      <stop offset="55%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.88)"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(5,7,10,0)"/>
      <stop offset="100%" stop-color="rgba(5,7,10,0.96)"/>
    </linearGradient>
  </defs>

  <rect width="400" height="700" fill="url(#bg)"/>
  <ellipse cx="194" cy="266" rx="250" ry="280" fill="url(#glow)"/>
  <circle cx="15" cy="671" r="0.9" fill="rgba(168,188,224,0.05)"/><circle cx="191" cy="363" r="0.8" fill="rgba(168,188,224,0.1)"/><circle cx="82" cy="306" r="0.6" fill="rgba(168,188,224,0.08)"/><circle cx="274" cy="122" r="1.4" fill="rgba(168,188,224,0.06)"/><circle cx="194" cy="346" r="1.7" fill="rgba(168,188,224,0.09)"/><circle cx="85" cy="72" r="1.1" fill="rgba(168,188,224,0.11000000000000001)"/><circle cx="375" cy="191" r="1.7" fill="rgba(168,188,224,0.12)"/><circle cx="180" cy="284" r="1.6" fill="rgba(168,188,224,0.08)"/><circle cx="207" cy="611" r="0.9" fill="rgba(168,188,224,0.11000000000000001)"/><circle cx="399" cy="67" r="1.9" fill="rgba(168,188,224,0.07)"/><circle cx="138" cy="444" r="2.2" fill="rgba(168,188,224,0.08)"/><circle cx="373" cy="240" r="2.0" fill="rgba(168,188,224,0.04)"/><circle cx="360" cy="592" r="1.3" fill="rgba(168,188,224,0.06)"/><circle cx="278" cy="70" r="1.2" fill="rgba(168,188,224,0.06)"/><circle cx="374" cy="510" r="1.8" fill="rgba(168,188,224,0.05)"/><circle cx="357" cy="453" r="1.8" fill="rgba(168,188,224,0.08)"/><circle cx="268" cy="668" r="1.2" fill="rgba(168,188,224,0.08)"/><circle cx="300" cy="488" r="2.6" fill="rgba(168,188,224,0.13)"/><circle cx="385" cy="263" r="1.3" fill="rgba(168,188,224,0.11000000000000001)"/><circle cx="395" cy="611" r="1.1" fill="rgba(168,188,224,0.08)"/><circle cx="330" cy="226" r="0.8" fill="rgba(168,188,224,0.12)"/><circle cx="58" cy="342" r="2.5" fill="rgba(168,188,224,0.13)"/><circle cx="136" cy="648" r="2.2" fill="rgba(168,188,224,0.04)"/><circle cx="182" cy="690" r="1.0" fill="rgba(168,188,224,0.04)"/><circle cx="230" cy="110" r="1.8" fill="rgba(168,188,224,0.06)"/><circle cx="98" cy="454" r="1.0" fill="rgba(168,188,224,0.06)"/><circle cx="386" cy="50" r="0.8" fill="rgba(168,188,224,0.06)"/><circle cx="173" cy="176" r="2.2" fill="rgba(168,188,224,0.12)"/><circle cx="200" cy="472" r="2.6" fill="rgba(168,188,224,0.1)"/><circle cx="24" cy="667" r="1.5" fill="rgba(168,188,224,0.07)"/><circle cx="111