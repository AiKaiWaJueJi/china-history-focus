  <!-- 同心环：展柜灯光 -->
  <g fill="none" stroke="rgba(216,185,138,0.13)" stroke-width="1">
    <circle cx="201" cy="331" r="118"/>
    <circle cx="201" cy="331" r="168"/>
    <circle cx="201" cy="331" r="232"/>
  </g>

  <!-- 器物剪影：鼎 / 罐 的抽象轮廓，强调边缘光 -->
  <!-- 缩放 0.62：面板只露出背景图中间的窄条（未悬浮时约 30% 宽度），
       器物必须在这么窄的裁切下依然完整可辨 -->
  <g transform="translate(201 331) rotate(-1) scale(0.62)">
    <ellipse cx="0" cy="128" rx="104" ry="18" fill="rgba(0,0,0,0.72)" filter="url(#soft)"/>

    <path d="M-80 -66 Q-96 44 -58 98 L58 98 Q96 44 80 -66 Z" fill="url(#vessel)"/>
    <path d="M-80 -66 Q-96 44 -58 98 L58 98 Q96 44 80 -66 Z" fill="none" stroke="rgba(216,185,138,0.72)" stroke-width="1.8"/>
    <!-- 腹部高光：一条竖向反光，制造金属/釉面的立体感 -->
    <path d="M-40 -40 Q-30 30 -34 86" fill="none" stroke="rgba(216,185,138,0.38)" stroke-width="7" stroke-linecap="round" filter="url(#soft)"/>

    <!-- 口沿 -->
    <rect x="-92" y="-84" width="184" height="20" rx="7" fill="rgba(216,185,138,0.42)"/>
    <rect x="-92" y="-84" width="184" height="5" rx="2.5" fill="rgba(216,185,138,0.72)"/>
    <!-- 立耳 -->
    <path d="M-56 -84 L-56 -124 Q-56 -132 -48 -132 M56 -84 L56 -124 Q56 -132 48 -132" fill="none" stroke="rgba(216,185,138,0.62)" stroke-width="8" stroke-linecap="round"/>
    <!-- 三足 -->
    <path d="M-38 98 L-33 140 M38 98 L33 140 M0 98 L0 146" stroke="rgba(216,185,138,0.55)" stroke-width="9" stroke-linecap="round"/>
  </g>

  <rect width="400" height="700" fill="url(#vig)"/>
  <rect y="430" width="400" height="270" fill="url(#fade)"/>
</svg>