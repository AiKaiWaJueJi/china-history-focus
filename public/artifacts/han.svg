<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="400" height="700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="38%" stop-color="rgba(155,58,46,0.42)"/>
      <stop offset="72%" stop-color="rgba(155,58,46,0.16)"/>
      <stop offset="100%" stop-color="#040506"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="52%">
      <stop offset="0%" stop-color="rgba(224,163,150,0.34)"/>
      <stop offset="58%" stop-color="rgba(155,58,46,0.1)"/>
      <stop offset="100%" stop-color="rgba(155,58,46,0)"/>
    </radialGradient>
    <linearGradient id="vessel" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="rgba(224,163,150,0.72)"/>
      <stop offset="42%" stop-color="rgba(155,58,46,0.52)"/>
      <stop offset="100%" stop-color="rgba(155,58,46,0.1)"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="42%" r="66%">
      <stop offset="55%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.88)"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(5,7,10,0)"/>
      <stop offset="100%" stop-color="rgba(5,7,10,0.96)"/>
    </linearGradient>
  </defs>

  <rect width="400" height="700" fill="url(#bg)"/>
  <ellipse cx="188" cy="287" rx="250" ry="280" fill="url(#glow)"/>
  <circle cx="195" cy="359" r="2.4" fill="rgba(224,163,150,0.04)"/><circle cx="309" cy="419" r="0.7" fill="rgba(224,163,150,0.09)"/><circle cx="183" cy="411" r="1.0" fill="rgba(224,163,150,0.04)"/><circle cx="330" cy="694" r="2.0" fill="rgba(224,163,150,0.1)"/><circle cx="370" cy="138" r="2.3" fill="rgba(224,163,150,0.07)"/><circle cx="352" cy="68" r="2.3" fill="rgba(224,163,150,0.07)"/><circle cx="243" cy="318" r="1.0" fill="rgba(224,163,150,0.06)"/><circle cx="170" cy="570" r="2.4" fill="rgba(224,163,150,0.1)"/><circle cx="74" cy="586" r="1.4" fill="rgba(224,163,150,0.11000000000000001)"/><circle cx="191" cy="238" r="1.4" fill="rgba(224,163,150,0.12)"/><circle cx="322" cy="94" r="2.0" fill="rgba(224,163,150,0.1)"/><circle cx="370" cy="145" r="2.1" fill="rgba(224,163,150,0.05)"/><circle cx="175" cy="439" r="2.3" fill="rgba(224,163,150,0.05)"/><circle cx="127" cy="311" r="2.7" fill="rgba(224,163,150,0.13)"/><circle cx="335" cy="623" r="2.4" fill="rgba(224,163,150,0.08)"/><circle cx="34" cy="9" r="2.4" fill="rgba(224,163,150,0.06)"/><circle cx="251" cy="473" r="1.1" fill="rgba(224,163,150,0.05)"/><circle cx="27" cy="503" r="2.5" fill="rgba(224,163,150,0.12)"/><circle cx="202" cy="309" r="1.9" fill="rgba(224,163,150,0.13)"/><circle cx="64" cy="576" r="1.6" fill="rgba(224,163,150,0.08)"/><circle cx="75" cy="699" r="1.7" fill="rgba(224,163,150,0.09)"/><circle cx="63" cy="125" r="1.4" fill="rgba(224,163,150,0.06)"/><circle cx="28" cy="343" r="1.1" fill="rgba(224,163,150,0.08)"/><circle cx="84" cy="299" r="2.7" fill="rgba(224,163,150,0.13)"/><circle cx="299" cy="379" r="0.7" fill="rgba(224,163,150,0.11000000000000001)"/><circle cx="43" cy="343" r="0.9" fill="rgba(224,163,150,0.11000000000000001)"/><circle cx="107" cy="223" r="1.3" fill="rgba(224,163,150,0.08)"/><circle cx="42" cy="569" r="2.3" fill="rgba(224,163,150,0.09)"/><circle cx="257" cy="405" r="1.7" fill="rgba(224,163,150,0.09)"/><circle cx="385" cy="440" r="2.4" fill="rgba(224,163,150,0.13)"/><circle cx="13" cy="