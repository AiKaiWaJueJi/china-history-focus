name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署需要的权限：读代码、写 pages、拿 OIDC token
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一次部署；新的 push 会取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # GitHub Pages 对不存在的路径返回 404，而本项目用 BrowserRouter（真路径）。
      # 把 index.html 复制成 404.html，刷新 /dynasty/tang 这类深链接时
      # Pages 会返回 404.html —— 但它其实是完整的 SPA 外壳，React Router 接管后正常渲染。
      # 这一步不能省，否则用户按 F5 就白屏。
      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
